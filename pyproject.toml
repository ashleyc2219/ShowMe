[project]
name = "showme"
version = "0.1.0"
description = "stdio MCP server that overlays step-by-step tutorials on a local web app"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "playwright",
]

[project.scripts]
showme = "showme.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["showme"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: 會開真的瀏覽器（headless Chromium），用 -m 'not browser' 跳過"]
timeout = 60
