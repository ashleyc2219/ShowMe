[project]
name = "showme"
version = "0.1.0"
description = "stdio MCP server that overlays step-by-step tutorials on a local web app"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "playwright",
]

[project.scripts]
showme = "showme.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["showme"]
